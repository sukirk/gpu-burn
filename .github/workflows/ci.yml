name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # tag 构建用于发 Release 时取 tag 名（v1.0.0）；平时是 dev
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  test:
    name: build + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 编译
        run: make
      - name: 端到端测试（假驱动，不需要 GPU）
        run: make check
      - name: PyTorch 版行为测试（假 torch，不需要 GPU）
        run: make check-py-cuda
      - name: PTX 一致性
        run: bash tests/cuda/verify_ptx.sh

  # 昇腾版：用假 libascendcl.so 跑端到端用例，CI 里不需要 NPU / CANN
  test-ascend:
    name: build + test (ascend, mock)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 编译
        run: make -C ascend
      - name: 端到端测试（假驱动，不需要 NPU）
        run: make -C ascend check
      - name: Python 版行为测试（假 torch，不需要 NPU）
        run: make check-py-ascend

  # 在老发行版容器里编并跑一遍测试：产物只要求 glibc 2.17，新版发行版上也能跑
  build-distro:
    name: build on ${{ matrix.label }}
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-20.04
            image: ubuntu:20.04
          - label: debian-13
            image: debian:13
          - label: debian-12
            image: debian:12
    steps:
      - uses: actions/checkout@v4
      - name: 编译 + 测试 + 打包
        run: bash .github/scripts/build-in-container.sh "${{ matrix.image }}" "${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-burn-${{ matrix.label }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # 在较新的发行版上直接用自带 gcc 编一遍
  build-host:
    name: build on ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-22.04
            runner: ubuntu-22.04
          - label: ubuntu-24.04
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 编译 + 测试 + 打包
        run: |
          make
          make check
          echo "==> glibc 最高要求：$(objdump -T gpu_burn | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          bash .github/scripts/package.sh "$VERSION" "${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-burn-${{ matrix.label }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # 昇腾版发布包：NPU 机器两种架构都有，各出一个
  build-ascend:
    name: build ascend on ${{ matrix.arch }}
    needs: test-ascend
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cc: cc
            objdump: objdump
          - arch: aarch64
            cc: aarch64-linux-gnu-gcc
            objdump: aarch64-linux-gnu-objdump
    steps:
      - uses: actions/checkout@v4
      - name: 安装 aarch64 交叉编译器
        if: matrix.arch == 'aarch64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: 编译 + 打包
        env:
          OBJDUMP: ${{ matrix.objdump }}
        run: |
          make -C ascend -B CC="${{ matrix.cc }}"
          bash .github/scripts/package-ascend.sh "$VERSION" "${{ matrix.arch }}" ubuntu-22.04 ascend/gpu_burn_ascend
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-burn-ascend-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # 推 v* tag 时收齐所有产物，建 Release 供下载
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-ascend, build-distro, build-host, build-ascend]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 逐个校验压缩包并生成 SHA256SUMS
        run: |
          set -e
          ls -l dist
          rm -rf /tmp/unpack && mkdir -p /tmp/unpack
          for f in dist/*.tar.gz; do
              tar -xzf "$f" -C /tmp/unpack
          done
          find /tmp/unpack -name gpu_burn -type f -perm -u+x -print
          count=$(find /tmp/unpack -name gpu_burn -type f -perm -u+x | wc -l)
          if [ "$count" -lt 5 ]; then
              echo "CUDA 版产物数量不对：$count 个（应至少 5 个）" >&2
              exit 1
          fi
          find /tmp/unpack -name gpu_burn_ascend -type f -perm -u+x -print
          count_ascend=$(find /tmp/unpack -name gpu_burn_ascend -type f -perm -u+x | wc -l)
          if [ "$count_ascend" -lt 2 ]; then
              echo "昇腾版产物数量不对：$count_ascend 个（应至少 2 个）" >&2
              exit 1
          fi
          ( cd dist && sha256sum *.tar.gz | tee SHA256SUMS )
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              dist/*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file .github/RELEASE_NOTES.md
